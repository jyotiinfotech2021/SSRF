<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sagat Singh Research Foundation (SSRF)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@600;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>/* =====================================================================
   SSRF portal stylesheet
   One definitive rule per selector. Order: tokens, base, layout,
   shared components, then page sections, then responsive overrides.

   Breakpoints (desktop first; CSS variables cannot be used in media queries):
     lg  max-width 900px   tablets, narrow laptops
     md  max-width 760px   large phones, small tablets
     sm  max-width 600px   phones
   ===================================================================== */
:root {
  /* Fixed palette (the SSRF colour system) */
  --olive-deep: #303B30;
  --burgundy: #762633;
  --brass-base: #B09555;
  --brass-soft: #C4AE78;
  --brass-light: #E6D7AE;
  --ivory: #F4F0E6;
  --charcoal: #252A27;
  --archive: #D8D8D0;
  /* Spacing scale */
  --sp-1: .25rem; --sp-2: .5rem; --sp-3: .75rem; --sp-4: 1rem; --sp-5: 1.25rem;
  --sp-6: 1.5rem; --sp-7: 2rem; --sp-8: 2.5rem; --sp-9: 3rem; --sp-10: 4rem;
  /* Type scale */
  --fs-2xs: .7rem; --fs-xs: .78rem; --fs-sm: .875rem; --fs-md: .95rem; --fs-base: 1.05rem;
  --fs-lg: 1.15rem; --fs-xl: 1.35rem; --fs-2xl: 1.75rem; --fs-3xl: 2.25rem;
  --fs-display: clamp(2.4rem, 6vw, 3.6rem);
  /* Image aspect ratios */
  --ar-photo: 4/3; --ar-video: 16/9; --ar-cover: 2/3; --ar-portrait: 4/5; --ar-square: 1;
  /* Surfaces */
  --shadow-card: 0 1px 2px rgba(37,42,39,.05), 0 4px 14px rgba(37,42,39,.04);
  --shadow-raised: 0 6px 22px rgba(37,42,39,.14);
}
:root {
  /* Headings */
  --fs-page: 2.4rem;          /* page titles (h2 at the top of a page) */
  --fs-section: 1.7rem;       /* section titles (.sect) */
  --fs-landing: clamp(1.8rem, 4.2vw, 2.6rem);  /* dark landing banners */
  --fs-card-title: 1.08rem;   /* titles inside cards and dossier sections */
}

/* ==================== 01. Tokens and themes ==================== */

html {
  scroll-padding-top: calc(env(safe-area-inset-top,0px) + 170px);
  overflow-x: clip;
}
:root {
  --stencil: "Big Shoulders Stencil Display", Impact, "Arial Narrow", sans-serif;
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top,0px);
  padding-bottom: env(safe-area-inset-bottom,0px);
  --olive-deep: #303B30;
  --charcoal: #252A27;
  --ivory: #F4F0E6;
  --archive: #D8D8D0;
  --brass-ink: #7C6731;
  --brass-light: #E6D7AE;
  --bg: #F4F0E6;
  --surface: #FBF9F4;
  --ink: #252A27;
  --muted: #5C625D;
  --line: #D8D8D0;
  --beret: #762633;
  --beret-ink: #FFFFFF;
  --olive: #303B30;
  --brass: #B09555;
  --field: #FFFFFF;
  --map-foreign: #E3E0D5;
  --map-sea: #D3DCDA;
  --map-india: #EEEADF;
  --map-focus: #FBF8F0;
  --map-line: #B8B4A5;
  --map-halo: #FBF8F0;
  --map-text: #3B413C;
  --river: #7FA3AE;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #1C201E;
  --surface: #242927;
  --ink: #ECE8DE;
  --muted: #A9AEA7;
  --line: #363C37;
  --beret: #CC7383;
  --beret-ink: #1C0E11;
  --olive: #A3B391;
  --brass: #C9AE6A;
  --brass-ink: #CDB577;
  --field: #2A2F2C;
  --map-foreign: #2A2F2C;
  --map-sea: #1F2A2C;
  --map-india: #323833;
  --map-focus: #3B423C;
  --map-line: #59605A;
  --map-halo: #242927;
  --map-text: #D8D8D0;
  --river: #5D8794;
}

/* ==================== 02. Base elements ==================== */

*,
*::before,
*::after {
  box-sizing: inherit;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--serif);
  font-size: var(--fs-base);
  line-height: 1.6;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top,0px);
  z-index: 10;
  background: var(--surface);
}
a {
  color: var(--beret);
}
img {
  max-width: 100%;
}
button {
  font: inherit;
  color: inherit;
}
:focus-visible {
  outline: 3px solid var(--brass);
  outline-offset: 2px;
}
input,
select {
  font: inherit;
  color: inherit;
  background: var(--field);
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: var(--sp-2) var(--sp-2);
  width: 100%;
}
label {
  display: block;
  font-weight: 600;
  margin: var(--sp-4) 0 var(--sp-1);
}
label small {
  font-weight: 400;
  color: var(--muted);
}
textarea {
  font: inherit;
  color: inherit;
  background: var(--field);
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: var(--sp-2) var(--sp-2);
  width: 100%;
  min-height: 10rem;
  resize: vertical;
}
mark {
  background: #F1DE9A;
  color: #1C2321;
}
h2 {
  font-family: var(--stencil);
  font-weight: 800;
  font-size: var(--fs-page);
  line-height: 1;
  margin: 0 0 var(--sp-2);
  color: var(--beret);
}
main {
  padding: var(--sp-8) 0 var(--sp-10);
}
main:focus,
main:focus-visible,
[tabindex="-1"]:focus {
  outline: none;
}
.sr-only {
  position: absolute !important;
  width: 1px !important;
  height: 1px !important;
  padding: 0 !important;
  margin: -1px !important;
  overflow: hidden !important;
  clip: rect(0 0 0 0) !important;
  white-space: nowrap !important;
  border: 0 !important;
  display: block !important;
}

/* ==================== 03. Layout and navigation ==================== */

.wrap {
  max-width: 62rem;
  margin: 0 auto;
  padding: 0 var(--sp-5);
}
nav.tabs .wrap {
  display: flex;
  gap: var(--sp-1);
  overflow-x: auto;
  align-items: center;
}
nav.tabs a {
  padding: var(--sp-3) var(--sp-3);
  text-decoration: none;
  color: var(--muted);
  border-bottom: 3px solid transparent;
  white-space: nowrap;
  font-weight: 600;
}
nav.tabs a[aria-current="page"] {
  color: var(--ink);
  border-bottom-color: var(--beret);
}
nav.tabs .me {
  margin-left: auto;
}
.grid2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0 var(--sp-4);
}
.grid-rel {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(16rem,1fr));
  gap: 0 var(--sp-6);
  margin-top: var(--sp-4);
  border-top: 1px solid var(--line);
}
.topbar {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding-top: var(--sp-2);
  padding-bottom: var(--sp-1);
}
.brand {
  display: flex;
  align-items: baseline;
  gap: var(--sp-2);
  text-decoration: none;
  color: var(--ink);
  margin-right: auto;
  min-width: 0;
}
.brand b {
  font-family: var(--stencil);
  font-weight: 800;
  font-size: var(--fs-2xl);
  color: var(--beret);
  line-height: 1;
}
.brand span {
  font-size: var(--fs-sm);
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.toplink {
  font-weight: 600;
  text-decoration: none;
  white-space: nowrap;
}
nav.tabs {
  top: env(safe-area-inset-top,0px);
  z-index: 5;
  position: static;
  border-bottom: none;
  background: transparent;
}
nav.subtabs .wrap {
  display: flex;
  gap: var(--sp-1);
  overflow-x: auto;
}
nav.subtabs a {
  padding: var(--sp-2) var(--sp-3);
  text-decoration: none;
  color: var(--muted);
  font-size: var(--fs-md);
  white-space: nowrap;
  border-bottom: 2px solid transparent;
}
nav.subtabs a[aria-current="page"] {
  color: var(--ink);
  border-bottom-color: var(--olive);
  font-weight: 600;
}
section.dos h4 {
  margin: 0 0 var(--sp-2);
  font-size: var(--fs-card-title);
}
section.dos {
  border-top: 1px solid var(--line);
  padding: var(--sp-6) 0;
}
.sub {
  color: var(--muted);
  margin: 0 0 var(--sp-6);
  max-width: 40rem;
  margin-bottom: var(--sp-7);
}
header.hero {
  padding: var(--sp-9) 0 var(--sp-7);
  border-bottom: 1px solid var(--line);
  border-color: transparent;
}
nav.subtabs {
  border-top: 1px solid var(--line);
  border-color: transparent;
}
.navs {
  position: sticky;
  top: env(safe-area-inset-top,0px);
  z-index: 5;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.dos h4 {
  color: var(--beret);
}

/* ==================== 04. Footer ==================== */

footer {
  font-size: var(--fs-sm);
  background: var(--charcoal);
  color: var(--archive);
  border-top: 3px solid var(--brass);
  margin-top: var(--sp-9);
  padding: var(--sp-7) 0 var(--sp-8);
}
footer a {
  color: var(--brass-light);
}
footer#siteFooter {
  background: var(--charcoal);
  color: var(--archive);
  border-top: 3px solid var(--brass-base);
  margin-top: var(--sp-10);
  padding: var(--sp-9) 0 0;
  font-size: var(--fs-md);
}
footer#siteFooter a {
  color: var(--archive);
  text-decoration: none;
}
footer#siteFooter a:hover,
footer#siteFooter a:focus-visible {
  color: var(--brass-light);
  text-decoration: underline;
  text-underline-offset: 3px;
}
.ft-wrap {
  display: grid;
  grid-template-columns: minmax(0,1.15fr) minmax(0,2fr);
  gap: var(--sp-8) var(--sp-9);
}
.ft-id {
  display: flex;
  gap: var(--sp-4);
  align-items: flex-start;
  color: var(--brass-base);
}
.ft-id svg {
  width: 3.2rem;
  height: 3.2rem;
  flex: none;
}
.ft-name {
  font-family: var(--stencil);
  font-size: var(--fs-lg);
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ivory);
  margin: .15rem 0 var(--sp-2);
  line-height: 1.25;
}
.ft-motto {
  font-style: italic;
  color: var(--brass-light);
  margin: 0;
  line-height: 1.45;
  font-size: var(--fs-md);
}
.ft-about {
  margin: var(--sp-5) 0 0;
  color: #A9AEA7;
  font-size: var(--fs-sm);
  line-height: 1.55;
  max-width: 24rem;
}
.ft-cols {
  display: grid;
  grid-template-columns: repeat(4,minmax(0,1fr));
  gap: var(--sp-6);
}
.ft-col h2 {
  font-family: var(--serif);
  font-size: var(--fs-2xs);
  font-weight: 600;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--brass-base);
  margin: 0 0 var(--sp-4);
  padding-bottom: var(--sp-2);
  border-bottom: 1px solid rgba(176,149,85,.35);
}
.ft-col ul {
  list-style: none;
  margin: 0;
  padding: 0;
}
.ft-col li {
  margin: 0 0 var(--sp-2);
}
.ft-base {
  grid-column: 1/-1;
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: var(--sp-2) var(--sp-7);
  border-top: 1px solid rgba(216,216,208,.16);
  padding: var(--sp-5) 0 var(--sp-6);
  margin-top: var(--sp-2);
  font-size: var(--fs-xs);
  color: #A9AEA7;
  letter-spacing: .02em;
}
.ft-base p {
  margin: 0;
}
.ft-base p:first-child {
  font-style: italic;
  color: var(--brass-soft);
}

/* ==================== 05. Buttons and links ==================== */

.btn {
  border: 2px solid var(--beret);
  background: var(--beret);
  color: var(--beret-ink);
  padding: var(--sp-2) var(--sp-4);
  border-radius: 3px;
  cursor: pointer;
  font-weight: 600;
}
.btn.ghost {
  background: transparent;
  color: var(--beret);
}
.btn.small {
  padding: var(--sp-1) var(--sp-3);
  font-size: var(--fs-md);
}
.btn:disabled {
  opacity: .5;
  cursor: not-allowed;
}
.link {
  background: none;
  border: none;
  color: var(--beret);
  cursor: pointer;
  padding: 0;
  text-decoration: underline;
  font-weight: 600;
}
.actions {
  display: flex;
  gap: var(--sp-4);
  align-items: center;
  flex-wrap: wrap;
  margin-top: var(--sp-2);
}
.salute {
  background: none;
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: var(--sp-1) var(--sp-2);
  cursor: pointer;
  color: var(--muted);
}
.link.quiet {
  font-weight: 400;
  color: var(--muted);
  font-size: var(--fs-sm);
}
a.btn {
  text-decoration: none;
  display: inline-block;
}
.salute[aria-pressed="true"] {
  border-color: var(--brass);
  font-weight: 600;
  color: var(--brass-ink);
}
.hero-band .btn.ghost:hover,
.alanding .btn.ghost:hover,
.lclanding .btn.ghost:hover,
.llanding .btn.ghost:hover,
.mlanding .btn.ghost:hover,
.cbanner .btn.ghost:hover {
  background: rgba(239,230,210,.12);
}
.btn:hover {
  filter: brightness(1.1);
}
.btn.ghost:hover {
  background: rgba(118,38,51,.07);
  filter: none;
}
.hero-band .btn.ghost,
.alanding .btn.ghost,
.lclanding .btn.ghost,
.cbanner .btn.ghost,
.llanding .btn.ghost,
.mlanding .btn.ghost {
  color: var(--ivory);
  border-color: rgba(239,230,210,.6);
  background: transparent;
}

/* ==================== 06. Forms ==================== */

.bar {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-2);
  align-items: center;
  margin-bottom: var(--sp-5);
}
.bar .grow {
  flex: 1;
}
fieldset.camps {
  border: 1px solid var(--line);
  margin: var(--sp-4) 0 0;
  padding: var(--sp-1) var(--sp-3) var(--sp-2);
}
fieldset.camps legend {
  font-weight: 600;
  padding: 0 var(--sp-1);
}
fieldset.camps .check {
  margin: var(--sp-1) 0 0;
}
.bar select {
  width: auto;
  max-width: 100%;
  min-width: 0;
}

/* ==================== 07. Shared content patterns ==================== */

.counts {
  margin-top: var(--sp-6);
  color: var(--muted);
  font-size: var(--fs-md);
}
.upl {
  display: inline-block;
  cursor: pointer;
}
.upl input {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
}
.inline-form {
  display: flex;
  gap: var(--sp-2);
  flex-wrap: wrap;
  margin-top: var(--sp-2);
}
.inline-form input {
  flex: 1;
  min-width: 12rem;
}
.body {
  white-space: pre-wrap;
  max-width: 40rem;
  margin: var(--sp-2) 0;
}
.body.clip {
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.seg-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-2);
  margin: 0 0 var(--sp-5);
}
.seg-tabs button {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 3px;
  padding: var(--sp-2) var(--sp-3);
  cursor: pointer;
  font-weight: 600;
  color: var(--muted);
}
.seg-tabs button[aria-selected="true"] {
  border-color: var(--beret);
  color: var(--ink);
  box-shadow: inset 0 -3px 0 var(--beret);
}
ul.rel {
  padding-left: var(--sp-4);
  margin: var(--sp-1) 0;
}
ul.rel li {
  margin-bottom: var(--sp-1);
}
.sect {
  font-family: var(--stencil);
  font-size: var(--fs-section);
  margin: var(--sp-7) 0 var(--sp-2);
}
.prose {
  max-width: 42rem;
}
label.check {
  display: flex;
  gap: var(--sp-2);
  align-items: flex-start;
  font-weight: 400;
  margin: var(--sp-3) 0 0;
}
label.check input {
  width: auto;
  margin-top: var(--sp-1);
}
.stat {
  background: var(--surface);
  padding: var(--sp-3);
}
.stat b {
  display: block;
  font-family: var(--stencil);
  font-size: var(--fs-2xl);
  line-height: 1;
}
.stat span {
  font-size: var(--fs-sm);
  color: var(--muted);
}
.stat.warn b {
  color: var(--beret);
}
.media-form input {
  flex: 1 1 11rem;
}
.inline-form.decide select {
  width: auto;
}
#hsearch input {
  width: 11rem;
  padding: var(--sp-1) var(--sp-2);
}
.legend {
  margin-bottom: var(--sp-4);
}
.item-h {
  font-size: var(--fs-2xl);
}
.ln {
  display: inline-block;
  width: 2.5rem;
  color: var(--muted);
  font-size: var(--fs-xs);
}
.quote {
  border-left: 3px solid var(--line);
  padding-left: var(--sp-3);
  color: var(--muted);
}
ol.trail {
  font-size: var(--fs-md);
  padding-left: var(--sp-5);
  margin: var(--sp-1) 0;
}
ol.results {
  list-style: none;
  padding: 0;
}
ol.results li {
  border-top: 1px solid var(--line);
  padding: var(--sp-3) 0;
}
ol.results li a {
  font-weight: 600;
  font-size: var(--fs-base);
}
ol.results li p {
  margin: var(--sp-1) 0 0;
  color: var(--muted);
  font-size: var(--fs-md);
}
.mosaic-empty {
  grid-column: 1/-1;
  grid-row: span 2;
  border: 1px dashed rgba(201,185,142,.45);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--brass-soft);
  text-align: center;
  padding: var(--sp-4);
}

/* ==================== 08. Tags, chips and labels ==================== */

.meta {
  color: var(--muted);
  font-size: var(--fs-md);
}
.tag {
  display: inline-block;
  font-size: var(--fs-xs);
  border: 1px solid var(--line);
  padding: .05rem var(--sp-2);
  border-radius: 2px;
  margin-right: var(--sp-1);
  color: var(--muted);
}
.tags {
  margin-bottom: var(--sp-1);
}
.tag.st-verified,
.tag.as-documented {
  border-color: var(--olive);
  color: var(--olive);
  font-weight: 600;
}
.tag.as-corroborated {
  border-color: var(--olive);
  color: var(--olive);
}
.tag.as-unverified {
  border-style: dashed;
}
.tag.st-rejected,
.tag.as-disputed {
  border-color: var(--beret);
  color: var(--beret);
}
.tag.nat {
  background: var(--bg);
}
.tag.ed {
  border-color: var(--ink);
  color: var(--ink);
  font-weight: 600;
}
.tag.mc {
  border-color: var(--muted);
}
.nosrc {
  color: var(--muted);
  font-style: italic;
}
.num {
  display: inline-block;
  min-width: 1.6rem;
  font-family: var(--stencil);
  color: var(--olive);
}
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-2);
  margin: var(--sp-1) 0;
}
.chip {
  border: 1px solid var(--line);
  background: var(--field);
  border-radius: 999px;
  padding: var(--sp-1) var(--sp-3);
  cursor: pointer;
}
.chip span {
  color: var(--muted);
  font-size: var(--fs-sm);
}
.chip.on {
  border-color: var(--beret);
  background: var(--beret);
  color: var(--beret-ink);
}
.chip.on span {
  color: inherit;
}
.sid {
  font-size: var(--fs-xs);
  background: var(--bg);
  border: 1px solid var(--line);
  padding: .05rem var(--sp-2);
  color: var(--ink);
  user-select: all;
}
.sid::before {
  content: "ID ";
  color: var(--muted);
  font-size: var(--fs-2xs);
}
.mtag {
  font-size: var(--fs-xs);
  border: 1px solid var(--line);
  padding: .08rem var(--sp-2);
  background: var(--bg);
}
.mtag.camp {
  border-color: var(--mc);
  color: var(--mc);
}
.tag.st-evidence,
.tag.st-checking,
.tag.st-recheck,
.tag.as-attributed {
  border-color: var(--brass);
  color: var(--brass-ink);
}

/* ==================== 09. Cards and panels ==================== */

.notice {
  background: var(--surface);
  border: 1px dashed var(--line);
  padding: var(--sp-3) var(--sp-4);
  margin-bottom: var(--sp-5);
  color: var(--muted);
}
.empty {
  padding: var(--sp-7) 0;
  color: var(--muted);
}
#toast {
  position: fixed;
  left: 50%;
  bottom: calc(1rem + env(safe-area-inset-bottom,0px));
  transform: translateX(-50%);
  background: var(--ink);
  color: var(--bg);
  padding: var(--sp-2) var(--sp-4);
  border-radius: 3px;
  display: none;
  z-index: 20;
  max-width: 90vw;
}
.panel.inline {
  margin: var(--sp-3) 0 0;
}
.card b {
  font-size: var(--fs-lg);
}
.card span {
  color: var(--ink);
}
.card em {
  font-style: normal;
  font-size: var(--fs-sm);
  color: var(--muted);
  margin-top: auto;
}
.card ul {
  margin: var(--sp-1) 0;
  padding-left: var(--sp-4);
}
.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 4px solid var(--olive);
  padding: var(--sp-5) var(--sp-6);
  margin-bottom: var(--sp-6);
  border-top-width: 0;
  border-right-width: 0;
  border-bottom-width: 0;
  box-shadow: var(--shadow-card);
}
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fill,minmax(9rem,1fr));
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  margin-bottom: var(--sp-4);
  border-left-width: 0;
  border-right-width: 0;
  border-bottom-width: 0;
  border-top-width: 0;
  box-shadow: var(--shadow-card);
}
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fill,minmax(16rem,1fr));
  gap: var(--sp-6);
}
.card {
  display: flex;
  flex-direction: column;
  gap: var(--sp-1);
  background: var(--surface);
  border: 1px solid var(--line);
  border-top: 3px solid var(--olive);
  text-decoration: none;
  color: var(--ink);
  border-left-width: 0;
  border-right-width: 0;
  border-bottom-width: 0;
  box-shadow: var(--shadow-card);
  border-top-width: 2px;
  padding: var(--sp-5) var(--sp-5);
  border-top-color: var(--brass);
}
a.card:hover {
  border-top-color: var(--beret);
}
.callouts {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(14rem,1fr));
  gap: var(--sp-6);
  margin: var(--sp-7) 0 var(--sp-6);
}
.callout {
  background: var(--surface);
  padding: var(--sp-5) var(--sp-5) var(--sp-4);
  border-top: 3px solid var(--brass);
  box-shadow: var(--shadow-card);
}
.callout b {
  display: block;
  font-family: var(--stencil);
  font-size: clamp(1.7rem,3.2vw,2.3rem);
  line-height: 1.05;
  color: var(--beret);
  margin-bottom: var(--sp-2);
  letter-spacing: .01em;
}
.callout p {
  margin: 0 0 var(--sp-2);
  font-size: var(--fs-md);
  line-height: 1.45;
}
.callout .meta {
  font-size: var(--fs-xs);
}

/* ==================== 10. Tables ==================== */

table.plain {
  border-collapse: collapse;
  width: 100%;
  max-width: 46rem;
  font-size: var(--fs-md);
}
table.plain th,
table.plain td {
  text-align: left;
  padding: var(--sp-2) var(--sp-2);
  border-bottom: 1px solid var(--line);
  vertical-align: top;
}
table.meta-table th {
  width: 14rem;
  color: var(--muted);
  font-weight: 600;
}
table.chron td:first-child {
  white-space: nowrap;
  color: var(--brass-ink);
}
table.sr-only {
  position: absolute !important;
  width: 1px !important;
  height: 1px !important;
  padding: 0 !important;
  margin: -1px !important;
  overflow: hidden !important;
  clip: rect(0 0 0 0) !important;
  white-space: nowrap !important;
  border: 0 !important;
  display: block !important;
}

/* ==================== 11. Claims, sources and evidence ==================== */

.project .status {
  font-size: var(--fs-sm);
  font-weight: 600;
  color: var(--olive);
}
ol.claims {
  padding-left: var(--sp-5);
  max-width: 44rem;
}
ol.claims li {
  margin-bottom: var(--sp-3);
}
.claim h3 {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-2);
  align-items: center;
}
.evbtn {
  font-size: var(--fs-md);
}
.evpanel {
  border-left: 3px solid var(--line);
  padding: var(--sp-1) 0 var(--sp-1) var(--sp-4);
  margin: var(--sp-2) 0 0;
}
.evpanel h4 {
  margin: var(--sp-3) 0 var(--sp-1);
  font-size: var(--fs-md);
}
ol.cites {
  padding-left: var(--sp-5);
  margin: var(--sp-1) 0;
  font-size: var(--fs-md);
}
ol.cites li {
  margin-bottom: var(--sp-1);
}
details.hist {
  margin: var(--sp-2) 0;
  font-size: var(--fs-md);
}
details.hist summary {
  cursor: pointer;
  color: var(--muted);
}
details.hist ol {
  padding-left: var(--sp-5);
}
.diff {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--sp-2);
  margin: var(--sp-1) 0;
}
.diff div {
  background: var(--surface);
  border: 1px solid var(--line);
  padding: var(--sp-2) var(--sp-2);
  white-space: pre-wrap;
}
.diff span {
  display: block;
  font-size: var(--fs-xs);
  color: var(--muted);
}
.citebox {
  margin: var(--sp-5) 0;
  font-size: var(--fs-md);
}
.citebox summary {
  cursor: pointer;
  font-weight: 600;
  color: var(--beret);
}
.cite-text {
  background: var(--surface);
  border: 1px solid var(--line);
  padding: var(--sp-2) var(--sp-3);
  font-size: var(--fs-sm);
}
.claims-list {
  list-style: none;
  padding: 0;
}
.claims-list .claim {
  border-left: 3px solid var(--line);
  padding-left: var(--sp-4);
  margin-bottom: var(--sp-4);
}
.nats {
  display: grid;
  grid-template-columns: repeat(auto-fill,minmax(11rem,1fr));
  gap: var(--sp-2);
}
.snat {
  display: inline-block;
  align-self: flex-start;
  background: var(--nc);
  color: #fff;
  font-size: var(--fs-2xs);
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  padding: .15rem var(--sp-2);
}
.sgrid {
  display: grid;
  grid-template-columns: repeat(auto-fill,minmax(21rem,1fr));
  gap: var(--sp-4);
  margin-top: var(--sp-3);
}
.scard.key {
  box-shadow: 0 0 0 1px var(--brass-base) inset;
  background: linear-gradient(180deg,rgba(176,138,62,.08),transparent 40%),var(--surface);
}
.scard.unused {
  opacity: .82;
}
.scard:target {
  outline: 3px solid var(--brass-base);
}
.scard-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: var(--sp-2);
}
.scard h3 {
  margin: .15rem 0 0;
  font-size: var(--fs-card-title);
  line-height: 1.3;
}
.scard h3 a {
  color: inherit;
  text-decoration: none;
}
.scard h3 a:hover {
  text-decoration: underline;
}
.sauth {
  margin: 0;
  font-size: var(--fs-sm);
  font-weight: 600;
}
.sauth span {
  font-weight: 400;
  color: var(--muted);
}
.suse {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--sp-2);
  font-size: var(--fs-xs);
  margin-top: .15rem;
}
.smeter {
  display: inline-flex;
  gap: 2px;
}
.smeter i {
  width: .42rem;
  height: .85rem;
  background: var(--line);
}
.smeter i.on {
  background: var(--nc);
}
.skey {
  background: var(--brass-base);
  color: #fff;
  font-size: var(--fs-2xs);
  text-transform: uppercase;
  letter-spacing: .06em;
  padding: .08rem var(--sp-2);
}
.swhere {
  color: var(--muted);
}
.snote {
  border-top: 1px dashed var(--line);
  margin-top: var(--sp-1);
  padding-top: var(--sp-2);
  font-size: var(--fs-sm);
  line-height: 1.5;
  color: var(--ink);
}
.snote span {
  display: block;
  font-size: var(--fs-2xs);
  text-transform: uppercase;
  letter-spacing: .07em;
  color: var(--muted);
  margin-bottom: .1rem;
}
.sopen {
  margin: .15rem 0 0;
  font-size: var(--fs-sm);
}
.suse b,
.sopen a {
  font-weight: 600;
}
.evgrid {
  display: grid;
  grid-template-columns: repeat(auto-fill,minmax(20rem,1fr));
  gap: var(--sp-4);
  margin-bottom: var(--sp-6);
}
.evkind {
  margin: 0;
  font-size: var(--fs-xs);
  color: var(--muted);
  display: flex;
  gap: var(--sp-2);
  align-items: center;
  flex-wrap: wrap;
}
.evcard blockquote {
  margin: 0;
  padding: var(--sp-3) var(--sp-4);
  background: var(--ivory);
  border: 1px solid #E2DCCB;
  font-family: Georgia,"Source Serif 4",serif;
  font-size: var(--fs-md);
  line-height: 1.55;
  color: var(--charcoal);
  position: relative;
}
.evcard.doc blockquote {
  background: repeating-linear-gradient(180deg,var(--ivory) 0 26px,#E9E3D3 26px 27px);
}
.evsrc {
  margin: 0;
  font-size: var(--fs-xs);
  color: var(--muted);
}
.evq {
  margin: 0;
  font-size: var(--fs-sm);
}
.evmap svg {
  width: 100%;
  height: auto;
  display: block;
}
.rcard .evbtn {
  align-self: flex-start;
}
.evmap {
  background: var(--bg);
  border: 1px solid var(--line);
  padding: var(--sp-1);
  border-left-width: 0;
  border-right-width: 0;
  border-bottom-width: 0;
  border-top-width: 0;
}
.scard {
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 5px solid var(--nc);
  padding: var(--sp-3) var(--sp-4);
  display: flex;
  flex-direction: column;
  gap: var(--sp-1);
  scroll-margin-top: 180px;
  border-top-width: 0;
  border-right-width: 0;
  border-bottom-width: 0;
  box-shadow: var(--shadow-card);
}
.evcard {
  background: var(--surface);
  border: 1px solid var(--line);
  border-top: 4px solid var(--brass-base);
  padding: var(--sp-4) var(--sp-4);
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
  border-left-width: 0;
  border-right-width: 0;
  border-bottom-width: 0;
  box-shadow: var(--shadow-card);
}

/* ==================== 12. Homepage ==================== */

.ops div {
  min-width: 7.5rem;
}
.mission {
  max-width: 40rem;
  margin: var(--sp-4) 0 0;
  color: var(--muted);
}
.entry {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-2);
  margin-top: var(--sp-5);
}
.entry .btn {
  text-decoration: none;
  display: inline-block;
}
section.hero {
  padding: var(--sp-7) 0 var(--sp-4);
}
.hero h1 {
  font-family: var(--stencil);
  font-weight: 800;
  font-size: clamp(3.5rem,13vw,8.5rem);
  line-height: .86;
  margin: 0;
  color: var(--beret);
  letter-spacing: .01em;
}
.hero .rank {
  font-family: var(--stencil);
  font-weight: 600;
  font-size: clamp(1.25rem,3.5vw,1.9rem);
  margin: 0 0 var(--sp-2);
  color: var(--olive);
}
.hero p.lede {
  max-width: 36rem;
  margin: var(--sp-5) 0 0;
  font-size: var(--fs-lg);
}
.ops a {
  display: block;
  min-width: 7.5rem;
  text-decoration: none;
  color: inherit;
}
.ops span,
.ops a span {
  font-size: var(--fs-md);
  color: var(--muted);
}
section.hero.has-portrait {
  display: grid;
  grid-template-columns: minmax(0,1fr) minmax(14rem,20rem);
  gap: var(--sp-7);
  align-items: end;
}
figure.portrait img {
  display: block;
  width: 100%;
  aspect-ratio: var(--ar-portrait);
  object-fit: cover;
  object-position: center top;
  border: 1px solid var(--line);
  filter: grayscale(.15);
}
figure.portrait figcaption {
  font-size: var(--fs-sm);
  color: var(--ink);
  margin-top: var(--sp-2);
  line-height: 1.4;
}
figure.portrait figcaption span {
  display: block;
  color: var(--muted);
  font-size: var(--fs-xs);
}
figure.portrait,
figure.emblem {
  margin: 0;
}
figure.emblem svg {
  display: block;
  width: 100%;
  height: auto;
}
.em-frame.thin {
  fill: none;
  stroke-width: 1;
}
.em-grid {
  stroke: var(--line);
  stroke-width: 1;
  stroke-dasharray: 2 5;
}
.em-route {
  fill: none;
  stroke: var(--beret);
  stroke-width: 3.5;
  stroke-linejoin: round;
}
.em-fill {
  fill: var(--beret);
}
.em-dot {
  fill: var(--beret);
  stroke: var(--surface);
  stroke-width: 3;
}
.em-frame,
.em-dot.hollow {
  fill: var(--surface);
  stroke: var(--beret);
  stroke-width: 3;
}
.em-place {
  font-family: var(--serif);
  font-size: 19px;
  font-weight: 600;
  fill: var(--ink);
}
.em-year {
  font-family: var(--stencil);
  font-size: 22px;
  font-weight: 800;
  fill: var(--olive);
}
.em-rule {
  stroke: var(--ink);
  stroke-width: 2;
}
.em-name {
  font-family: var(--stencil);
  font-size: 52px;
  font-weight: 800;
  fill: var(--beret);
}
.em-dates {
  font-family: var(--serif);
  font-size: 20px;
  fill: var(--ink);
}
.em-tiny {
  font-family: var(--serif);
  font-size: 13px;
  fill: var(--muted);
}
section.hero.hero-band {
  display: block;
  position: relative;
  width: 100vw;
  margin-left: calc(50% - 50vw);
  padding: var(--sp-9) 0 var(--sp-8);
  color: var(--ivory);
  background: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1600 700' preserveAspectRatio='xMidYMid slice'><g fill='none' stroke='%23d8c08a' stroke-opacity='.11' stroke-width='1.2'><path d='M420 520 L418 528 L415 535 L410 542 L404 548 L396 553 L387 557 L377 560 L368 562 L360 564 L353 567 L348 571 L344 577 L340 584 L335 592 L329 599 L320 605 L310 607 L300 608 L290 605 L280 602 L272 598 L263 595 L254 593 L245 591 L235 588 L226 585 L219 580 L213 574 L210 567 L209 559 L210 551 L211 544 L211 538 L211 532 L211 526 L210 520 L208 514 L207 508 L207 501 L206 495 L205 487 L205 479 L205 471 L207 462 L211 454 L218 447 L227 443 L239 442 L251 443 L263 445 L274 448 L284 451 L292 452 L300 452 L308 450 L317 448 L326 448 L335 449 L343 452 L350 456 L356 461 L362 466 L368 470 L375 474 L383 477 L392 481 L401 485 L409 491 L415 497 L419 504 L420 512 L420 520Z'/><path d='M468 520 L464 531 L459 541 L454 551 L451 561 L449 571 L447 583 L444 594 L437 605 L426 614 L412 619 L395 620 L377 619 L360 616 L345 613 L333 611 L322 611 L311 613 L300 618 L288 622 L275 627 L260 629 L246 631 L230 631 L215 629 L200 626 L185 621 L172 615 L161 606 L153 596 L150 584 L149 572 L152 560 L154 549 L156 539 L156 529 L155 520 L152 510 L151 500 L152 491 L157 481 L165 473 L176 467 L187 461 L197 456 L205 450 L211 441 L215 430 L221 418 L228 406 L238 395 L252 387 L267 382 L284 382 L300 386 L315 391 L329 398 L341 405 L353 413 L363 420 L372 428 L379 436 L386 444 L393 451 L401 457 L410 463 L421 468 L433 474 L446 481 L457 489 L465 498 L468 509 L468 520Z'/><path d='M519 520 L522 534 L522 549 L518 563 L511 577 L501 590 L491 602 L481 614 L471 626 L459 638 L446 649 L429 656 L409 660 L388 659 L366 655 L346 648 L329 642 L314 638 L300 639 L285 644 L269 652 L249 661 L227 669 L204 673 L182 672 L162 666 L146 656 L134 643 L123 630 L115 616 L107 603 L100 589 L96 575 L94 561 L95 547 L98 533 L103 520 L108 508 L113 496 L116 484 L120 471 L124 459 L131 448 L140 437 L152 428 L165 420 L178 413 L190 404 L201 393 L212 .hero-band .hero-inner {
  max-width: 62rem;
  margin: 0 auto;
  padding: 0 var(--sp-5);
  display: grid;
  grid-template-columns: minmax(0,1fr) minmax(17rem,25rem);
  gap: var(--sp-8);
  align-items: center;
}
.hero-band .rank {
  color: var(--brass-soft);
}
.hero-band p.lede {
  color: var(--ivory);
}
.hero-band p.mission {
  color: var(--archive);
}
.hero-band figure.portrait {
  margin: 0;
  padding: var(--sp-2);
  background: #1C201E;
  border: 2px solid var(--brass-base);
  box-shadow: 0 18px 40px rgba(0,0,0,.45);
}
.hero-band figure.portrait img {
  aspect-ratio: auto;
  filter: none;
  border: 0;
}
.hero-band figure.portrait figcaption {
  color: var(--ivory);
  font-size: var(--fs-sm);
  margin-top: var(--sp-2);
  text-align: center;
}
.hero-band figure.portrait figcaption span {
  color: var(--brass-soft);
  font-size: var(--fs-xs);
  font-style: italic;
}
.hero-band figure.emblem {
  background: var(--ivory);
  padding: var(--sp-3);
  border: 2px solid var(--brass-base);
}
.ops {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-2) var(--sp-6);
  margin-top: var(--sp-6);
  padding-top: var(--sp-4);
  border-top: 2px solid var(--brass);
}
.hero-band h1,
.hero-band figure.portrait figcaption a,
.hero-band h2 {
  color: var(--brass-light);
}
.ops b,
.ops a b {
  display: block;
  font-family: var(--stencil);
  font-size: var(--fs-2xl);
  line-height: 1;
  font-weight: 800;
  color: var(--brass-ink);
}
.ops a:hover b {
  color: var(--beret);
}
section.hero.hero-band.hero-cine {
  padding: var(--sp-10) 0 var(--sp-10);
  background: linear-gradient(90deg,rgba(37,42,39,.55) 0%,rgba(37,42,39,0) 55%),
  repeating-linear-gradient(0deg,rgba(176,149,85,.045) 0 1px,transparent 1px 64px),
  repeating-linear-gradient(90deg,rgba(176,149,85,.045) 0 1px,transparent 1px 64px),
  radial-gradient(ellipse at 72% 40%,#3B473B 0%,var(--olive-deep) 42%,var(--charcoal) 100%);
}
.hero-cine .hero-inner {
  max-width: 78rem;
  padding: 0 var(--sp-7);
  grid-template-columns: minmax(0,1.3fr) minmax(0,1fr);
  gap: var(--sp-10);
  align-items: center;
}
.hero-cine .hero-mark {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  color: var(--brass-base);
  margin: 0 0 var(--sp-7);
}
.hero-cine .hero-mark svg {
  width: 2.4rem;
  height: 2.4rem;
  flex: none;
}
.hero-cine .hero-mark span {
  font-size: var(--fs-2xs);
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--brass-soft);
}
.hero-cine .hk-rank {
  font-family: var(--serif);
  font-size: var(--fs-md);
  font-weight: 600;
  letter-spacing: .32em;
  text-transform: uppercase;
  color: var(--brass-soft);
  margin: 0 0 var(--sp-3);
}
.hero-cine h1 {
  font-size: clamp(3.2rem,7.4vw,6.2rem);
  line-height: .92;
  color: var(--ivory);
  letter-spacing: .015em;
  margin: 0;
}
.hero-cine .hk-hon {
  font-size: clamp(.95rem,1.6vw,1.12rem);
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--brass-light);
  margin: var(--sp-4) 0 var(--sp-1);
}
.hero-cine .hk-years {
  font-family: var(--stencil);
  font-size: var(--fs-xl);
  letter-spacing: .08em;
  color: var(--brass-base);
  margin: 0;
}
.hero-cine .hk-rule {
  width: 4.5rem;
  height: 0;
  border: 0;
  border-top: 2px solid var(--brass-base);
  margin: var(--sp-6) 0 var(--sp-6);
}
.hero-cine p.lede {
  font-size: var(--fs-lg);
  max-width: 34rem;
  margin: 0 0 var(--sp-3);
  color: var(--ivory);
}
.hero-cine p.mission {
  font-size: var(--fs-md);
  max-width: 34rem;
  color: var(--archive);
  margin: 0 0 var(--sp-6);
}
.hero-cine figure.portrait {
  padding: 0;
  background: transparent;
  border: 0;
  box-shadow: none;
  position: relative;
}
.hero-cine figure.portrait img {
  display: block;
  width: 100%;
  height: auto;
  object-fit: contain;
  border: 1px solid rgba(176,149,85,.75);
  outline: 1px solid rgba(176,149,85,.25);
  outline-offset: 8px;
  box-shadow: 0 28px 60px rgba(0,0,0,.5);
}
.hero-cine figure.portrait figcaption {
  margin-top: var(--sp-4);
  text-align: left;
  font-size: var(--fs-sm);
  color: var(--archive);
  border-left: 2px solid var(--brass-base);
  padding-left: var(--sp-2);
  line-height: 1.4;
}
.hero-cine figure.portrait figcaption span {
  display: block;
}

/* ==================== 13. Biography and timeline ==================== */

details.life {
  margin-top: var(--sp-5);
  max-width: 44rem;
}
details.life summary {
  cursor: pointer;
  font-weight: 600;
  color: var(--beret);
}
details.life ol {
  margin-top: var(--sp-5);
}
ol.timeline li {
  position: relative;
  padding: 0 0 var(--sp-6) var(--sp-6);
  max-width: 42rem;
}
ol.timeline h3 {
  margin: var(--sp-1) 0;
  font-size: var(--fs-lg);
}
ol.timeline p {
  margin: 0;
}
ol.timeline h3 .tag {
  font-family: var(--serif);
  font-weight: 400;
  vertical-align: middle;
}
ol.timeline li li {
  padding: 0 0 var(--sp-1) 0;
}
ol.timeline li li::before {
  content: none;
}
ol.timeline ol {
  list-style: decimal;
  padding-left: var(--sp-5);
}
.when {
  font-family: var(--stencil);
  font-weight: 800;
  font-size: var(--fs-xl);
  line-height: 1.1;
  color: var(--brass-ink);
}
ol.timeline .yr {
  font-family: var(--stencil);
  font-weight: 800;
  font-size: var(--fs-2xl);
  line-height: 1;
  color: var(--brass-ink);
}
ol.timeline {
  list-style: none;
  padding: 0;
  margin: 0;
  border-left: 3px solid var(--beret);
  border-left-color: var(--brass);
}
ol.timeline li::before {
  content: "";
  position: absolute;
  left: -.55rem;
  top: .45rem;
  width: .8rem;
  height: .8rem;
  border: 3px solid var(--beret);
  border-radius: 50%;
  border-color: var(--brass);
  background: var(--bg);
}

/* ==================== 14. Campaigns ==================== */

.camp h4 {
  margin: var(--sp-6) 0 var(--sp-2);
  font-size: var(--fs-card-title);
}
.toc {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-1) var(--sp-4);
  margin: 0 0 var(--sp-4);
  padding: var(--sp-2) 0;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  font-size: var(--fs-sm);
}
.ctree ul {
  list-style: none;
  margin: 0;
  padding-left: var(--sp-6);
  position: relative;
}
.ctree {
  list-style: none;
  margin: 0;
  position: relative;
  padding-left: 0;
}
.ctree li {
  position: relative;
  padding: var(--sp-1) 0 var(--sp-1) 0;
}
.ctree ul li::before {
  content: "";
  position: absolute;
  left: -1rem;
  top: 0;
  bottom: 0;

}
.ctree ul li::after {

.cnode {

.cnode span {

.cnode em {

}
.cnode.his {

}
.cnode.unchecked {

figure.map {

  border: 1px solid var(--line);

}
figure.map svg {

  height: auto;

}
figure.map figcaption {
  font-size: var(--fs-sm);
  color: var(--muted);
  margin-top: var(--sp-2);
}
.mlabel {

  fill: var(--ink);

}
.msmall {

  fill: var(--muted);

  font-style: italic;
}
.map-wanted {

}
.lvpanel h3 {

  margin: var(--sp-4) 0 var(--sp-1);
  color: var(--olive-deep);
}
.lvpanel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-top: 0;
  padding: var(--sp-2) var(--sp-5) var(--sp-4);
  margin-bottom: var(--sp-6);
  border-left-width: 0;
  border-right-width: 0;
  border-bottom-width: 0;
  border-top-width: 0;

}
.cbanner.has-img {
  background: linear-gradient(90deg,rgba(37,42,39,.92) 0%,rgba(37,42,39,.7) 50%,rgba(37,42,39,.35) 100%),var(--cb-img) center/cover no-repeat;
}
.cbanner .cb-shape {

  stroke-width: 2;
  vector-effect: non-scaling-stroke;
  pointer-events: none;
}
.cbanner .cb-year {

  right: 3%;
  bottom: -.18em;
  font-family: var(--stencil);
  font-size: clamp(6rem,17vw,13rem);
  line-height: 1;
  color: rgba(176,149,85,.13);
  letter-spacing: .02em;
  pointer-events: none;
}
.cbanner .cb-eye {
  font-size: var(--fs-xs);
  letter-spacing: .24em;
  text-transform: uppercase;
  color: var(--brass-soft);
  margin: 0 0 var(--sp-4);
}
.cbanner .cb-title {
  font-family: var(--stencil);
  font-size: clamp(2rem,4.6vw,3.4rem);
  line-height: 1.02;
  color: var(--ivory);
  margin: 0 0 var(--sp-4);
  max-width: 44rem;
  letter-spacing: .01em;
}
.cbanner .cb-lead {
  font-size: var(--fs-lg);
  line-height: 1.55;
  color: var(--archive);
  max-width: 40rem;
  margin: 0 0 var(--sp-7);
}
.cbanner .cb-facts {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(10.5rem,1fr));

  margin: 0;
  max-width: 52rem;
  border-top: 1px solid rgba(176,149,85,.6);
}
.cbanner .cb-facts div {
  padding: var(--sp-3) var(--sp-5) var(--sp-1) 0;
}
.cbanner .cb-facts dt {
  font-size: var(--fs-2xs);
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--brass-base);
  margin: 0 0 var(--sp-1);
}
.cbanner .cb-facts dd {
  margin: 0;
  font-size: var(--fs-md);
  color: var(--ivory);
  line-height: 1.35;
}
.cbanner .cb-credit {
  position: absolute;
  right: 1rem;
  bottom: .6rem;
  margin: 0;
  font-size: var(--fs-2xs);
  color: var(--archive);
  opacity: .8;
}
figure.cmap {
  margin: var(--sp-4) 0 0;
  background: var(--surface);
  padding: var(--sp-3);
  box-shadow: var(--shadow-card);
}
.mp-foreign {
  fill: var(--map-foreign);
}
.mp-sea {
  fill: var(--map-sea);
}
.mp-india {
  fill: var(--map-india);
}
.mp-internal {
  fill: none;
  stroke: var(--map-line);
  stroke-width: 1;
  stroke-dasharray: 4 3;
}
.mp-river {
  fill: none;
  stroke: var(--river);
  stroke-width: 5;
  stroke-linecap: round;
  stroke-linejoin: round;
  opacity: .9;
}
.mp-rlabel {
  font-size: 13px;
  font-style: italic;
  fill: var(--river);
  paint-order: stroke;
  stroke: var(--map-halo);
  stroke-width: 3px;
}
.mp-region {
  font-size: 13px;
  letter-spacing: .18em;
  fill: var(--map-text);
  opacity: .55;
}
.mp-adv {
  fill: none;
  stroke: var(--beret);
  stroke-width: 3.2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.mp-adv2 {
  fill: none;
  stroke: var(--olive);
  stroke-width: 3.2;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-dasharray: 1 0;
}
.mp-air {
  fill: none;
  stroke: var(--beret);
  stroke-width: 2.6;
  stroke-dasharray: 8 5;
  stroke-linecap: round;
}
.mp-arrowhead {
  fill: var(--beret);
}
.mp-rtlabel {
  font-size: 13px;
  font-weight: 700;
  fill: var(--beret);
  paint-order: stroke;
  stroke: var(--map-halo);
  stroke-width: 4px;
}
.mp-arrowhead2,
.mp-rtlabel.two {
  fill: var(--olive);
}
.mp-town {
  fill: var(--map-text);
  stroke: var(--map-halo);
  stroke-width: 1.5;
}
.mp-cap,
.mp-clash {
  fill: var(--beret);
  stroke: var(--map-halo);
  stroke-width: 1.5;
}
.mp-out {
  fill: var(--map-halo);
  stroke: var(--map-text);
  stroke-width: 1.6;
}
.mp-label {
  font-size: 14px;
  fill: var(--map-text);
  paint-order: stroke;
  stroke: var(--map-halo);
  stroke-width: 4px;
  stroke-linejoin: round;
}
.mp-label.strong {
  font-weight: 700;
  font-size: 15px;
}
.mp-scale {
  stroke: var(--map-text);
  stroke-width: 2;
  fill: none;
}
.mp-small {
  font-size: 12px;
  fill: var(--map-text);
}
.mp-north {
  fill: var(--map-text);
}
.mp-insetbg {
  fill: var(--surface);
  stroke: var(--line);
}
.mp-insetland {
  fill: var(--map-india);
  stroke: var(--map-text);
  stroke-width: 2;
}
.mp-insetbox {
  fill: none;
  stroke: var(--beret);
  stroke-width: 2.2;
}
figure.cmap figcaption {
  margin-top: var(--sp-3);
  font-size: var(--fs-sm);
  color: var(--muted);
  line-height: 1.45;
}
.mp-legend {
  list-style: none;
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-2) var(--sp-6);
  margin: 0 0 var(--sp-2);
  padding: 0;
  color: var(--ink);
}
.mp-legend li {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  font-size: var(--fs-sm);
}
.mp-legend svg {
  width: 28px;
  height: 12px;
  flex: none;
  overflow: visible;
}
ol.vchron {
  list-style: none;
  margin: var(--sp-6) 0 var(--sp-2);
  padding: 0;
  display: grid;
  grid-template-columns: repeat(var(--n),minmax(0,1fr));
  gap: 0 var(--sp-5);
  position: relative;
}
ol.vchron::before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 9px;
  height: 2px;
  background: linear-gradient(90deg,var(--brass),var(--brass) 92%,transparent);
}
ol.vchron li {
  position: relative;
  padding-top: var(--sp-7);
}
ol.vchron .vc-dot {
  position: absolute;
  top: 2px;
  left: 0;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--bg);
  border: 3px solid var(--brass);
}
ol.vchron li.ms .vc-dot {
  background: var(--beret);
  border-color: var(--beret);
  width: 20px;
  height: 20px;
  top: 0;
  box-shadow: 0 0 0 4px rgba(118,38,51,.15);
}
ol.vchron time {
  display: block;
  font-family: var(--stencil);
  font-size: var(--fs-base);
  letter-spacing: .03em;
  color: var(--brass-ink);
  margin-bottom: var(--sp-1);
  line-height: 1.2;
}
ol.vchron li.ms time {
  color: var(--beret);
}
ol.vchron p {
  margin: 0 0 var(--sp-2);
  font-size: var(--fs-md);
  line-height: 1.42;
}
ol.vchron li.ms p {
  font-weight: 600;
}
ol.vchron .vc-src {
  font-size: var(--fs-xs);
  color: var(--muted);
}
.orgchart {
  overflow-x: auto;
  padding: var(--sp-2) 0 var(--sp-2);
}
.orgchart ul {
  display: flex;
  justify-content: center;
  margin: 0;
  padding: var(--sp-6) 0 0;
  position: relative;
  list-style: none;
}
.orgchart li {
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
  padding: var(--sp-6) var(--sp-2) 0;
}
.orgchart>ul,
.orgchart>ul>li {
  padding-top: 0;
}
.orgchart li::before {
  content: "";
  position: absolute;
  top: 0;
  width: 50%;
  height: 1.4rem;
  border-top: 2px solid var(--brass);
  right: 50%;
}
.orgchart li::after {
  content: "";
  position: absolute;
  top: 0;
  width: 50%;
  height: 1.4rem;
  border-top: 2px solid var(--brass);
  left: 50%;
  border-left: 2px solid var(--brass);
}
.orgchart li:only-child::after {
  border-top: 0;
  left: 50%;
  width: 0;
}
.orgchart li:only-child::before,
.orgchart li:first-child::before {
  border-top: 0;
}
.orgchart li:last-child::before {
  border-right: 2px solid var(--brass);
  width: 50%;
  right: 50%;
}
.orgchart li:last-child::after {
  border-top: 0;
  border-left: 0;
}
.orgchart li:first-child::after {
  border-radius: 0;
}
.orgchart ul ul::before {
  content: "";
  position: absolute;
  top: 0;
  left: 50%;
  height: 1.4rem;
  border-left: 2px solid var(--brass);
}
.oc-node {
  background: var(--surface);
  min-width: 10.5rem;
  max-width: 14rem;
  padding: var(--sp-3) var(--sp-4) var(--sp-3);
  text-align: center;
  border-top: 3px solid var(--olive);
  box-shadow: var(--shadow-card);
  display: flex;
  flex-direction: column;
  gap: var(--sp-1);
}
.oc-node .oc-lvl {
  font-size: var(--fs-2xs);
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--brass-ink);
}
.oc-node b {
  font-size: var(--fs-md);
  line-height: 1.25;
}
.oc-node .oc-who {
  font-size: var(--fs-sm);
  color: var(--muted);
}
.oc-node .oc-who.muted {
  font-style: italic;
}
.oc-node em {
  font-size: var(--fs-2xs);
  font-style: normal;
  color: var(--muted);
}
.oc-node.his {
  background: var(--beret);
  border-top-color: var(--brass);
  color: var(--ivory);
  box-shadow: 0 6px 22px rgba(118,38,51,.28);
}
.oc-node.his .oc-who {
  color: var(--ivory);
}
.oc-node.his .oc-lvl,
.oc-node.his em,
.oc-node.his em a {
  color: var(--brass-light);
}
.oc-node .oc-his {
  align-self: center;
  margin-top: var(--sp-1);
  font-size: var(--fs-2xs);
  letter-spacing: .18em;
  text-transform: uppercase;
  background: var(--brass-base);
  color: var(--charcoal);
  padding: .15rem var(--sp-2);
}
.oc-node.unchecked {
  opacity: .6;
  border-top-style: dashed;
}
.cphotos {
  display: grid;
  gap: var(--sp-4);
  margin: var(--sp-6) 0 var(--sp-2);
}
.cphotos.n2 {
  grid-template-columns: 1fr 1fr;
}
.cphotos.n3 {
  grid-template-columns: 2fr 1fr 1fr;
}
.cphotos figure {
  margin: 0;
}
.cphotos img {
  display: block;
  width: 100%;
  height: auto;
  max-height: 26rem;
  object-fit: cover;
  filter: sepia(.08);
}
.cphotos figcaption {
  font-size: var(--fs-sm);
  margin-top: var(--sp-2);
  border-left: 2px solid var(--brass);
  padding-left: var(--sp-2);
  line-height: 1.4;
}
.cphotos figcaption span {
  display: block;
  color: var(--muted);
  font-style: italic;
  font-size: var(--fs-xs);
}
.dossier.camp-dossier {
  max-width: none;
}
.dossier,
.camp-dossier>.toc,
.camp-dossier>.dos>:not(.cmap):not(.vchron):not(.orgchart):not(.cphotos):not(table),
.camp-dossier>p {
  max-width: 46rem;
}
.cbanner {
  position: relative;
  overflow: hidden;
  width: 100vw;
  margin: 0 0 0 calc(50% - 50vw);
  padding: var(--sp-9) 0 var(--sp-9);
  color: var(--ivory);
  background: repeating-linear-gradient(0deg,rgba(176,149,85,.045) 0 1px,transparent 1px 64px),repeating-linear-gradient(90deg,rgba(176,149,85,.045) 0 1px,transparent 1px 64px),radial-gradient(ellipse at 78% 40%,#3B473B 0%,var(--olive-deep) 45%,var(--charcoal) 100%);
  margin-top: var(--sp-2);
}
.mp-focus {
  fill: var(--map-focus);
  stroke-width: 2;
  stroke-linejoin: round;
  stroke: none;
}
.mp-focusline {
  fill: none;
  stroke: var(--brass);
  stroke-width: 2;
  stroke-linejoin: round;
}
figure.cmap .cmap-scroll>svg {
  display: block;
  margin: 0 auto;
  width: 100%;
  height: auto;
  max-height: 80vh;
  font-family: var(--sans,system-ui,sans-serif);
  outline: 1px solid var(--line);
}
.orgchart>ul>li::before,
.orgchart>ul>li::after,
.cmap-hint {
  display: none;
}
.cbanner .cb-inner {
  position: relative;
  margin: 0 auto;
  max-width: 62rem;
  padding: 0 var(--sp-5);
}

/* ==================== 15. People and units ==================== */

.person {
  background: var(--surface);
  padding: var(--sp-4);
}
.person .who {
  display: flex;
  gap: var(--sp-2);
  align-items: center;
}
.person p {
  margin: var(--sp-2) 0 0;
  font-size: var(--fs-md);
}
.people {
  display: grid;
  grid-template-columns: repeat(auto-fill,minmax(15rem,1fr));
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  border-left-width: 0;
  border-right-width: 0;
  border-bottom-width: 0;
  border-top-width: 0;
  box-shadow: var(--shadow-card);
}

/* ==================== 16. Archive and viewer ==================== */

.gallery img,
.gallery video {
  width: 100%;
  aspect-ratio: var(--ar-photo);
  object-fit: cover;
  display: block;
  background: var(--line);
  border-radius: 2px;
}
.gallery figure {
  margin: 0;
  position: relative;
}
.gallery .rm {
  position: absolute;
  top: .25rem;
  right: .25rem;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 2px;
  font-size: var(--fs-xs);
  padding: 0 var(--sp-1);
  cursor: pointer;
}
.gallery figcaption {
  font-size: var(--fs-xs);
  color: var(--muted);
  line-height: 1.3;
  margin-top: var(--sp-1);
}
.gallery figcaption span {
  display: block;
}
.arch {
  display: grid;
  grid-template-columns: 9.5rem 1fr auto;
  gap: var(--sp-1) var(--sp-3);
  align-items: baseline;
  background: var(--surface);
  padding: var(--sp-2) var(--sp-3);
  text-decoration: none;
  color: var(--ink);
}
.arch span {
  grid-column: 2;
  font-size: var(--fs-sm);
  color: var(--muted);
}
.arch code {
  font-size: var(--fs-sm);
  color: var(--olive);
}
.transcript p {
  margin: .15rem 0;
}
.alanding {
  width: 100vw;
  margin-left: calc(50% - 50vw);
  background: radial-gradient(ellipse at 80% 30%,#3D4A3D 0%,var(--olive-deep) 50%,var(--charcoal) 100%);
  color: var(--ivory);
  padding: var(--sp-8) 0 var(--sp-7);
  margin-bottom: var(--sp-6);
}
.alanding-inner {
  max-width: 62rem;
  margin: 0 auto;
  padding: 0 var(--sp-5);
  display: grid;
  grid-template-columns: minmax(0,1fr) minmax(0,1.15fr);
  gap: var(--sp-7);
  align-items: center;
}
.alanding .eyebrow {
  font-size: var(--fs-xs);
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--brass-soft);
  margin: 0 0 var(--sp-2);
}
.alanding p {
  color: var(--archive);
  margin: 0 0 var(--sp-3);
}
.alanding-stats {
  font-size: var(--fs-md);
}
.alanding-stats b {
  color: var(--brass-light);
  font-size: var(--fs-lg);
}
.alanding-mosaic {
  display: grid;
  gap: var(--sp-2);
  grid-template-columns: repeat(3,1fr);
  grid-auto-rows: 7.5rem;
}
.alanding-mosaic.n1 {
  grid-template-columns: 1fr;
  grid-auto-rows: 16rem;
}
.alanding-mosaic.n2 {
  grid-template-columns: 1fr 1fr;
  grid-auto-rows: 15rem;
}
.alanding-mosaic a {
  position: relative;
  display: block;
  overflow: hidden;
  border: 1px solid rgba(201,185,142,.35);
}
.alanding-mosaic a:first-child {
  grid-row: span 2;
  grid-column: span 1;
}
.alanding-mosaic.n1 a:first-child,
.alanding-mosaic.n2 a:first-child {
  grid-row: auto;
}
.alanding-mosaic img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: sepia(.15);
  transition: transform .3s;
}
.alanding-mosaic a:hover img {
  transform: scale(1.04);
}
.alanding-mosaic code {
  position: absolute;
  left: .35rem;
  bottom: .35rem;
  font-size: var(--fs-2xs);
  background: rgba(0,0,0,.65);
  color: var(--brass-light);
  padding: .05rem var(--sp-1);
}
.aicon {
  width: 1.05em;
  height: 1.05em;
  vertical-align: -.15em;
  flex: none;
}
.aicon.big {
  width: 2.6rem;
  height: 2.6rem;
}
.atypes {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-2);
  margin: 0 0 var(--sp-6);
}
.atype {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-1);
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  padding: var(--sp-2) var(--sp-3);
  border-radius: 999px;
  cursor: pointer;
  font: inherit;
  font-size: var(--fs-sm);
}
.atype i {
  font-style: normal;
  font-size: var(--fs-xs);
  color: var(--muted);
}
.atype.on {
  background: var(--ink);
  color: var(--bg);
  border-color: var(--ink);
}
.atype.on i {
  color: inherit;
  opacity: .75;
}
.asect {
  font-size: var(--fs-base);
  margin: var(--sp-5) 0 var(--sp-2);
  display: flex;
  gap: var(--sp-3);
  align-items: baseline;
}
.acolls {
  display: grid;
  grid-template-columns: repeat(auto-fill,minmax(13.5rem,1fr));
  gap: var(--sp-2);
}
.acoll {
  display: grid;
  grid-template-columns: 2.4rem 1fr;
  grid-template-rows: auto auto;
  column-gap: var(--sp-3);
  align-items: center;
  text-align: left;
  font: inherit;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 4px solid var(--cc);
  padding: var(--sp-2) var(--sp-3);
  cursor: pointer;
}
.acoll i {
  grid-row: span 2;
  width: 2.4rem;
  height: 2.4rem;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--cc);
  color: #fff;
  font-style: normal;
  font-weight: 700;
  font-size: var(--fs-sm);
  letter-spacing: .04em;

}
.ipin circle {

}
.ipin.active circle {

}
.ipin .ipin-halo {

}

}
.ipin text {

}

}

}
.chfacts {

.chfacts dt {

.chstats div {

.chstats b {

.chstats span {

.chact h4 {

.chlab {

}
.chact ul {
  margin: 0;
  padding-left: var(--sp-4);
  font-size: var(--fs-sm);
}
.chphotos {

.mlanding h2 {

}
.mgrp {

}

  border-right-width: 0;

}
.chstats {
  display: grid;
  grid-template-columns: repeat(4,1fr);

  background: var(--bg);

  border-right-width: 0;
  border-bottom-width: 0;
  border-top-width: 0;

}
.chcard {

  border-right-width: 0;

/* ==================== 21. Learning centre and quiz ==================== */

.quiz h2 {
  font-size: var(--fs-2xl);
}

}

}
.quiz .choice {
  text-align: left;

}
.lchk {
  font-size: var(--fs-2xs);

}
.natcard p {
  margin: 0;

}
.lclanding {

}

}
.lclanding p {
  color: var(--archive);
}

}

}

}

}

}

  fill: #6B756A;
}
.lmap-halo {

}

  margin-top: auto;

}
.qpolish h2 {
  font-family: var(--stencil);
  color: var(--burgundy);
  margin-top: 0;
}
.qpolish .choices {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--sp-2);
  counter-reset: opt;
}
.qpolish .choice {
  counter-increment: opt;
  display: flex;
  gap: var(--sp-3);
  align-items: center;
  font-size: var(--fs-md);
  padding: var(--sp-3) var(--sp-4);
  background: #fff;
  border: 1.5px solid var(--line);
  transition: border-color .15s,transform .1s;
}
.qpolish .choice::before {
  content: counter(opt,upper-alpha);
  flex: none;
  width: 1.8rem;
  height: 1.8rem;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
  border: 1px solid var(--line);
  font-weight: 700;
  font-size: var(--fs-sm);
}

  border-color: var(--burgundy);

  background: #E9ECE4;
}

  background: var(--olive-deep);

  border-color: var(--olive-deep);
}
.qpolish .choice.wrong {
  border-color: var(--burgundy);
  background: #F5E7E8;
}
.qpolish .choice.wrong::before {
  background: var(--burgundy);
  color: #fff;
  border-color: var(--burgundy);
}

  font-size: var(--fs-xl);
  line-height: 1.35;
  font-weight: 600;
  margin: var(--sp-3) 0;
}

}

}

}
.lvtab {
  font: inherit;
  background: none;
  border: 0;
  border-bottom: 3px solid transparent;
  margin-bottom: -2px;
  padding: var(--sp-2) var(--sp-4) var(--sp-2);
  cursor: pointer;
  text-align: left;
  color: var(--muted);
}
.lvtab b {
  display: block;
  font-size: var(--fs-md);
  color: var(--ink);
}
.lvtab span {
  font-size: var(--fs-xs);
}
.lvtab.on {
  border-bottom-color: var(--burgundy);
}
.lvtab.on b {
  color: var(--burgundy);
}
.tgrid {
  display: grid;
  grid-template-columns: repeat(auto-fill,minmax(16rem,1fr));
  gap: var(--sp-4);
  margin-bottom: var(--sp-2);
}
a.tcard:hover {

  box-shadow: 0 4px 12px rgba(0,0,0,.08);
}

  grid-row: span 3;

  height: 3.8rem;

  align-items: center;
  justify-content: center;

  font-size: var(--fs-xs);

.tcard.plain .tic {
  background: var(--olive-deep);

  border-radius: 50%;
  width: 3rem;
  height: 3rem;
}
.tcard b {
  font-size: var(--fs-md);
}
.tcard span {
  font-size: var(--fs-sm);
  color: var(--muted);
  line-height: 1.45;
}
.tcard em {
  font-style: normal;
  font-weight: 600;
  color: var(--burgundy);
  font-size: var(--fs-sm);
}
.lclanding h2 {
  font-family: var(--stencil);
  font-size: var(--fs-landing);
  line-height: 1.02;
  margin: 0 0 var(--sp-3);
  color: var(--brass-light);
}
.lcamp {
  font-size: var(--fs-2xs);
  text-transform: uppercase;
  letter-spacing: .05em;
  color: var(--muted);
  border: 1px solid var(--line);
  padding: .08rem var(--sp-2);
  border-left-width: 0;
  border-right-width: 0;
  border-bottom-width: 0;
  border-top-width: 0;
  box-shadow: var(--shadow-card);
}
.natcard {
  text-align: left;
  font: inherit;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line);
  border-top: 5px solid var(--nc);
  padding: var(--sp-3) var(--sp-3);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: var(--sp-1);
  border-left-width: 0;
  border-right-width: 0;
  border-bottom-width: 0;
  box-shadow: var(--shadow-card);
}
.lccard {
  background: var(--surface);
  border: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  border-left-width: 0;
  border-right-width: 0;
  border-bottom-width: 0;
  border-top-width: 0;
  box-shadow: var(--shadow-card);
}
.tcard {
  display: grid;
  grid-template-columns: 3rem 1fr;
  grid-template-rows: auto 1fr auto;
  column-gap: var(--sp-3);

  margin-top: var(--sp-2);

:"2026-11-17T14:00:00Z","reviewedBy":"ssrf","scope":"life","status":"settled","text":"Born on 14 July 1919 in Kusumdesar, in present-day Churu district of Rajasthan, then part of Bikaner State.","unresolved":"","year":"1919","id":"life-1919"},{"assessment":"corroborated","cites":[{"loc":"p. 19: enrolled as a Naik in the Bikaner State Forces' Ganga Risala by Lt Col Balu Singh Shekhawat on Maj Khem Singh's recommendation, after his intermediate exams in 1938","s":"book"},{"loc":"\"enrolled as a Naik in the Bikaner Ganga Risala\"","s":"wiki"},{"loc":"\"In 1941, the unit landed at Basra\"","s":"wiki"},{"loc":"\"he received a commission as a Second Lieutenant from the King\"","s":"fo"},{"loc":"his son's account of his start as a Naik in 1938","s":"trib"},{"loc":"para 4 says \"Jaipur State Forces\"; SSRF treats this as an error (see note)","s":"pib"}],"createdAt":"2026-11-15T06:00:00Z","established":"He served in the Bikaner State Forces, enrolling as a Naik in the Ganga Risala in 1938 (A Talent for War, p. 19), and was commissioned during the Second World War.","familyNote":"Confirmed with the family by the SSRF founder, 15 November 2026.","heading":"Bikaner State Forces","order":2,"prev":{"established":"He began in the ranks of a princely state's forces in 1938 and was commissioned during the Second World War.","text":"Enrolled as a Naik in the Bikaner Ganga Risala in 1938, after his intermediate examination. He moved with the Sadul Light Infantry, landed at Basra in 1941, and was commissioned during the Second World War."},"reviewedAt":"2026-11-15T16:10:00Z","reviewedBy":"ssrf","scope":"life","status":"settled","text":"Enrolled as a Naik in the Bikaner Ganga Risala in 1938, immediately after his intermediate examination. The commanding officer, Lt Col Balu Singh Shekhawat, enrolled him on the recommendation of the second-in-command, Maj Khem Singh. He moved with the Sadul Light Infantry, landed at Basra in 1941, and was commissioned during the Second World War.","unresolved":"Settled: Bikaner State Forces, per A Talent for War p. 19, confirmed with the family. The 2001 PIB release's \"Jaipur State Forces\" is an error. Still to record: the exact date and rank of his commission.","year":"1938","id":"life-1938"},{"assessment":"corroborated","cites":[{"loc":"p. 30: transferred to 3 Gorkha Rifles in February 1949; posted as GSO2","s":"book"},{"loc":"\"In 1949, Singh was transferred to the Indian Army\"","s":"wiki"},{"loc":"\"In February 1955 … commanding officer of the second battalion 3rd Gorkha Rifles (2/3 GR) at Ferozepur\"","s":"wiki"},{"loc":"para 4: joined \"on amalgamation\"","s":"pib"}],"createdAt":"2026-11-15T06:00:00Z","established":"He joined the 3rd Gorkha Rifles in February 1949 (A Talent for War, p. 30) and spent his regimental career with it.","heading":"Into the Indian Army and the 3rd Gorkha Rifles","order":3,"prev":{"assessment":"disputed","text":"Transferred to the Indian Army and the 3rd Gorkha Rifles when the state forces were absorbed. He commanded the regiment's 2nd Battalion from February 1955, later its 3rd Battalion, and was Colonel of the Regiment from 1969 to 1976."},"reviewedAt":"2026-11-15T16:15:00Z","reviewedBy":"ssrf","scope":"life","status":"settled","text":"Transferred to the 3rd Gorkha Rifles of the Indian Army in February 1949, when the Bikaner State Forces were absorbed, and posted as a General Staff Officer Grade 2 (GSO2). He commanded the regiment's 2nd Battalion from February 1955, later its 3rd Battalion, and was Colonel of the Regiment from 1969 to 1976.","unresolved":"Settled: February 1949, per A Talent for War p. 30, consistent with Wikipedia's 1949. Still to record: the formation or headquarters where he served as GSO2.","year":"1949","id":"life-1949"},{"assessment":"corroborated","cites":[{"loc":"\"In September 1961, Singh was promoted to the rank of brigadier\"","s":"wiki"},{"loc":"\"the first to reach the capital of Goa, Panjim on 19 December 1961\"","s":"wiki"},{"loc":"para 5","s":"pi
